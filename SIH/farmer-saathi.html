<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monsoon Saathi — Farmer Mode</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { background: #020617; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .animate-ping-slow { animation: pingslow 1.5s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes pingslow { 75%,100% { transform: scale(2); opacity: 0; } }
</style>
</head>
<body class="text-slate-100 font-sans max-w-full overflow-x-hidden">

<div id="app" class="flex min-h-screen flex-col bg-slate-950 text-slate-100 font-sans max-w-full overflow-x-hidden">
  <!-- Rendered by JS -->
</div>

<!-- FULL CROP CATALOG MODAL -->
<div id="cropModal" class="fixed inset-0 z-[600] bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-3xl p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="sprout" class="text-emerald-400" style="width:20px;height:20px"></i>
        <h2 class="text-base font-black text-white">Full Crop Catalog (<span id="cropTotal"></span> Crops)</h2>
      </div>
      <button onclick="closeCropModal()" class="p-1 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
        <i data-lucide="x" style="width:20px;height:20px"></i>
      </button>
    </div>
    <div class="relative">
      <i data-lucide="search" class="text-slate-400 absolute left-3 top-3" style="width:16px;height:16px"></i>
      <input id="cropSearch" type="text" placeholder="Search crop name in English, Hindi, or Odia..."
        oninput="state.cropSearch=this.value; renderCropGrid();"
        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
    </div>
    <div id="modalCatPills" class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar"></div>
    <div id="modalCropGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
  </div>
</div>

<!-- LIVE TAVILY AI SEARCH MODAL -->
<div id="tavilyModal" class="fixed inset-0 z-[600] bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-3xl p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto font-sans">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="globe" class="text-sky-400 animate-pulse" style="width:20px;height:20px"></i>
        <div>
          <h2 class="text-base font-black text-white">Live Tavily AI Web Intelligence</h2>
          <p class="text-[10px] text-slate-400">Real-time web search for ICAR/KVK advisories, mandi prices &amp; weather news</p>
        </div>
      </div>
      <button onclick="closeTavilyModal()" class="p-1 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
        <i data-lucide="x" style="width:20px;height:20px"></i>
      </button>
    </div>

    <!-- Custom Query Search Form -->
    <form onsubmit="handleTavilySearch(event)" class="space-y-3">
      <div>
        <label class="text-[11px] font-bold text-slate-300">Custom Search Query (Optional):</label>
        <input id="tavilyQuery" type="text" placeholder="Default: ICAR advisory &amp; mandi price..."
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 mt-1" />
      </div>
      <button id="tavilySubmitBtn" type="submit"
        class="w-full py-2.5 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-black rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg transition-all cursor-pointer disabled:opacity-50">
        <span id="tavilyBtnLabel">Fetch Real-Time Web Intelligence</span>
      </button>
    </form>

    <div id="tavilyError" class="hidden p-3 rounded-xl bg-rose-950/60 border border-rose-600/60 text-xs text-rose-200 font-semibold items-center gap-2"></div>
    <div id="tavilyResults" class="space-y-3"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-6 left-1/2 z-[700] -translate-x-1/2 hidden px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-600 text-xs font-bold text-white shadow-2xl"></div>

function apiCandidates() {
  const saved = (localStorage.getItem('saathi_api_base') || '').replace(/\/+$/, '');
  const list = [];
  if (saved) list.push(saved);
  if (typeof location !== 'undefined' && /^https?:$/.test(location.protocol) && location.origin) {
    list.push(location.origin.replace(/\/+$/, '') + '/api');
  }
  list.push('http://localhost:5005/api');
  list.push('https://hyperlocal-monsoon-intelligence.onrender.com/api');
  return [...new Set(list)];
}

/* ============ FILTERED CROPS ============ */
function filteredCrops() {
  return CROP_DATABASE.filter(c => {
    const matchesCategory = state.activeCategory === 'All' || c.category === state.activeCategory;
    const q = state.cropSearch.toLowerCase().trim();
    const matchesSearch = !q || c.name.toLowerCase().includes(q) || c.name_hi.includes(q) || c.name_or.includes(q) || c.id.includes(q);
    return matchesCategory && matchesSearch;
  });
}

/* ============ 7-DAY FORECAST STRIP ============ */
function forecastStrip() {
  if (state.forecastData && state.forecastData.daily_strip && state.forecastData.daily_strip.length) {
    return state.forecastData.daily_strip;
  }
  const m = state.forecastData && state.forecastData.metrics ? state.forecastData.metrics : metrics();
  return Array.from({ length: 7 }).map((_, idx) => {
    const d = new Date();
    d.setDate(d.getDate() + idx);
    const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dayName = idx === 0 ? "Today" : daysOfWeek[d.getDay()];
    const totalRain = m.expected_rainfall_mm || 45;
    let rain = idx === 0 ? Math.round(totalRain * 0.32) : idx === 1 ? Math.round(totalRain * 0.28) : idx === 2 ? Math.round(totalRain * 0.22) : idx === 3 ? Math.round(totalRain * 0.12) : idx === 4 ? Math.round(totalRain * 0.06) : 0;
    let icon = rain >= 15 ? "🌧️" : rain >= 8 ? "🌦️" : rain > 0 ? "⛅" : "☀️";
    return { day: dayName, date: d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), rain_mm: rain, icon, temp_max: Math.round((m.temperature_c || 31) + (idx < 3 ? 1.5 : 0.5)), temp_min: Math.round((m.temperature_c || 31) - 5.5) };
  });
}

/* ============ TTS (Google Translate Audio + WebSpeech fallback) ============ */
let currentAudio = null;
function odiaToDevanagariPhonetic(text) {
  return text
    .replace(/[\u0B01-\u0B71]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x0200))
    .replace(/्य़/g, '्य')
    .replace(/िँ/g, 'िं')
    .replace(/़/g, '')
    .trim();
}
function stopTTS() {
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
    currentAudio = null;
  }
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}
function playTTS({ text, lang, onStart, onEnd, onError }) {
  if (!text) return;
  stopTTS();
  const isOdia = lang === 'or';
  const isHindi = lang === 'hi';
  let cleanText = text.replace(/[\n\r]+/g, ' ').replace(/[#*_`]/g, '').trim().slice(0, 180);
  let ttsText = cleanText;
  let ttsLang = isHindi || isOdia ? 'hi' : 'en';
  if (isOdia) ttsText = odiaToDevanagariPhonetic(cleanText);

  const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(ttsText)}&tl=${ttsLang}&client=tw-ob`;
  const audio = new Audio();
  currentAudio = audio;
  audio.onplay = () => { if (onStart) onStart(); };
  audio.onended = () => { currentAudio = null; if (onEnd) onEnd(); };

  const fallbackToWebSpeech = () => {
    currentAudio = null;
    if (!('speechSynthesis' in window)) { if (onError) onError(); return; }
    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(isOdia ? ttsText : cleanText);
      utterance.lang = isOdia || isHindi ? 'hi-IN' : 'en-IN';
      utterance.rate = 0.85;
      utterance.pitch = 1;
      utterance.onstart = () => { if (onStart) onStart(); };
      utterance.onend = () => { if (onEnd) onEnd(); };
      utterance.onerror = () => { if (onError) onError(); };
      const voices = window.speechSynthesis.getVoices();
      if (voices && voices.length > 0) {
        const match = voices.find(v => v.lang.startsWith(lang) || (isOdia && v.lang.startsWith('hi')));
        if (match) utterance.voice = match;
      }
      window.speechSynthesis.speak(utterance);
    } catch (err) { if (onError) onError(); }
  };

  audio.onerror = () => { fallbackToWebSpeech(); };
  audio.src = ttsUrl;
  audio.play().catch(() => { fallbackToWebSpeech(); });
}

function handleAudioPlay() {
  if (state.isPlayingAudio) {
    stopTTS();
    state.isPlayingAudio = false;
    renderMain();
    return;
  }
  state.ttsError = false;
  const adv = getCropTimeAdvisory();
  const textToRead = `${cur().appTitle}. ${cur().location}: ${location.block}, ${cleanDistrict()}. ${adv.cropMeta.name}. ${adv.headline}. ${adv.dos.join('. ')}`;
  playTTS({
    text: textToRead,
    lang: state.lang,
    onStart: () => { state.isPlayingAudio = true; renderMain(); },
    onEnd: () => { state.isPlayingAudio = false; renderMain(); },
    onError: () => { state.isPlayingAudio = false; state.ttsError = true; renderMain(); }
  });
}

/* ============ API HELPERS ============ */
async function checkWeatherAlert() {
  if (!API_BASE) return null;
  try {
    const res = await fetch(`${API_BASE}/weather/alerts/check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ district_name: cleanDistrict(), block_name: location.block, phone_number: PHONE_DEFAULT })
    });
    if (res.ok) return await res.json();
  } catch (err) { console.warn('checkWeatherAlert failed', err); }
  return null;
}

async function fetchTavilyAgriSearch({ cropName, district, block, query, tavilyKey }) {
  if (!API_BASE) return null;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 20000);
    const res = await fetch(`${API_BASE}/agri/tavily-search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cropName, district, block, query, tavilyKey }),
      signal: ctrl.signal
    }).finally(() => clearTimeout(t));
    // Backend returns useful JSON even on 400/502 (message + tavily_detail).
    // Parse the body regardless of res.ok so the real reason is shown to farmer.
    const data = await res.json().catch(() => null);
    if (data) return data;
    if (res.ok) return { status: 'success', answer: '', results: [] };
  } catch (err) {
    console.warn('fetchTavilyAgriSearch failed', err);
    return { status: 'error', network: true, message: 'Backend not reachable. Showing curated ICAR/KVK advisory.' };
  }
  return { status: 'error', message: 'Failed to fetch real-time web search results.' };
}

async function probeApiBase() {
  const locId = location.locationId;
  const url = (base) => `${base}/forecast/${encodeURIComponent(locId)}?horizon=7&panchayat=${encodeURIComponent(location.panchayat)}`;
  for (const base of apiCandidates()) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), API_PROBE_TIMEOUT);
      const res = await fetch(url(base), { signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) {
        const data = await res.json();
        if (data && data.status === 'success' && data.metrics) {
          console.log('Live API detected at:', base);
          return base;
        }
      }
    } catch (e) {
      console.warn('API probe failed for', base, e.message);
    }
  }
  return null;
}

async function loadForecast() {
  if (!API_BASE) return;
  try {
    const res = await fetch(`${API_BASE}/forecast/${encodeURIComponent(location.locationId)}?horizon=7&panchayat=${encodeURIComponent(location.panchayat)}`);
    if (res.ok) {
      const data = await res.json();
      state.forecastData = data && data.metrics ? data : null;
    }
  } catch (err) { console.warn('Forecast load failed, using fallback', err); }
}

function detectLiveGPS() {
  if (!navigator.geolocation) {
    showToast('GPS not supported by your browser');
    return;
  }
  showToast('Requesting real-time GPS location...');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&addressdetails=1`);
        const data = await res.json();
        if (data && data.address) {
          const addr = data.address;
          const distRaw = addr.state_district || addr.district || addr.county || addr.city || 'Khordha';
          const distClean = distRaw.replace(/ district/i, '').trim();
          const blockRaw = addr.suburb || addr.town || addr.village || addr.city_district || `${distClean} Sadar`;
          const gpRaw = addr.village || addr.suburb || addr.neighbourhood || 'Patia';

          location = {
            district: distClean,
            block: blockRaw,
            panchayat: gpRaw,
            locationId: `loc-${distClean.toLowerCase()}-${blockRaw.toLowerCase()}`
          };
          localStorage.setItem('moes_selected_location', JSON.stringify(location));
          showToast(`📍 GPS Location: ${gpRaw}, ${distClean}`);
          loadForecast();
          fetchAutoLiveCropData();
          renderMain();
          return;
        }
      } catch (e) {}
      showToast('GPS position updated');
    },
    (err) => {
      showToast('GPS permission denied.');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

      <div class="flex items-center justify-between gap-2">
        ${statusPill()}
        <button onclick="retryLiveData()" class="text-[10px] font-bold text-sky-400 hover:text-sky-300 cursor-pointer underline underline-offset-2">↻ Retry live data</button>
      </div>

      <!-- 3 Quick Status Indicators -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3 space-y-1 shadow-md">
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${L.rainfallStatus}</div>
          <div class="text-sm font-black text-sky-300 font-sans">${m.expected_rainfall_mm} <span class="text-[10px] font-medium text-slate-400">mm</span></div>
          <div class="text-[10px] text-slate-500 font-semibold">${m.break_probability >= 0.60 ? 'Irregular' : 'Favorable'}</div>
        </div>
        <div class="rounded-2xl bg-orange-950/40 border border-orange-800/60 p-3 space-y-1 shadow-md">
          <div class="text-[10px] font-bold text-orange-400 uppercase tracking-wider">${L.sowingRisk}</div>
          <div class="text-sm font-black text-orange-300">${m.break_probability >= 0.60 ? L.high : L.moderate}</div>
          <div class="text-[10px] text-orange-400/80 font-semibold">${m.break_probability >= 0.60 ? 'Caution' : 'Optimal'}</div>
        </div>
        <div class="rounded-2xl bg-rose-950/40 border border-rose-800/60 p-3 space-y-1 shadow-md">
          <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">${L.drySpellRisk}</div>
          <div class="text-sm font-black text-rose-300 font-sans">${Math.round(m.break_probability * 100)}%</div>
          <div class="text-[10px] text-rose-400/80 font-semibold">10–14 Days</div>
        </div>
      </div>

      <!-- Real-Time Nowcast Card -->
      <div class="rounded-2xl bg-slate-900 border border-slate-700 p-4 space-y-3 shadow-lg">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="radio" class="text-cyan-400 animate-pulse" style="width:16px;height:16px"></i>
            <span class="text-xs font-black uppercase tracking-wider text-cyan-300">Live Rain Nowcast</span>
          </div>
          <span class="text-[9px] text-slate-500 font-bold bg-slate-800 px-2 py-1 rounded-full border border-slate-700">Next 12 Hours</span>
        </div>
        ${nowcastBody()}
        <button onclick="handleCheckWeather()" ${state.checkingWeather ? 'disabled' : ''}
          class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-xs font-black transition-all cursor-pointer shadow-md ${state.checkingWeather ? 'bg-slate-800 text-slate-500 cursor-wait' : 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-cyan-900/40'}">
          ${state.checkingWeather ? spinnerHtml() : iconHtml('bell-ring')}
          <span>${state.checkingWeather ? "Checking..." : "Check My Weather & Send SMS Alert"}</span>
        </button>
      </div>

      <!-- Dynamic Multi-Crop Time & Weather AI Advice Box -->
      <div class="rounded-2xl bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-emerald-500/50 p-4 sm:p-5 space-y-4 shadow-2xl relative overflow-hidden">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-ping-slow"></span>
            <span class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider">${L.todayAdvice}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-black px-2.5 py-0.5 rounded-full border ${adv.badgeColor}">${adv.advisoryType}</span>
            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-200 border border-slate-700 flex items-center gap-1">
              <span>${adv.cropMeta.icon}</span>
              <span>${cropLabel(adv.cropMeta)}</span>
            </span>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="inline-flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl text-[11px] text-amber-300 font-bold">
            <i data-lucide="calendar" class="text-amber-400" style="width:14px;height:14px"></i>
            <span>${adv.seasonWindow}</span>
          </div>
          <button onclick="openTavilyModal()"
            class="inline-flex items-center gap-1.5 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white px-3 py-1 rounded-xl text-[11px] font-black shadow-md transition-all cursor-pointer">
            <i data-lucide="globe" class="text-white" style="width:14px;height:14px"></i>
            <span>🌐 Live Web AI Search</span>
          </button>
        </div>

        <p class="text-sm sm:text-base font-extrabold text-white leading-snug">${adv.headline}</p>

        <button onclick="handleAudioPlay()"
          class="w-full flex items-center justify-center gap-2.5 py-2.5 rounded-xl text-xs font-black transition-all cursor-pointer shadow-lg ${state.isPlayingAudio ? 'bg-amber-500 text-slate-950 animate-pulse' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-700/30'}">
          ${state.isPlayingAudio ? iconHtml('volume-x') : iconHtml('volume-2')}
          <span>${state.isPlayingAudio ? L.audioPlaying : L.audioListen}</span>
        </button>
        ${state.ttsError ? `<div class="text-[10px] text-rose-400 font-semibold text-center">Voice playback failed on this device.</div>` : ''}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
          ${adviceBlock('emerald', 'check-circle-2', L.doTitle, adv.dos, '•')}
          ${adviceBlock('rose', 'x-circle', L.dontTitle, adv.donts, '•')}
          ${adviceBlock('cyan', 'shield-check', L.advTitle, adv.advantages, '✓')}
          ${adviceBlock('amber', 'alert-triangle', L.riskTitle, adv.risks, '!')}
        </div>
      </div>

      <!-- 25+ Crop Catalog Selector Bar -->
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3 shadow-lg">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs font-black text-white flex items-center gap-1.5">
              <i data-lucide="sprout" class="text-emerald-400" style="width:16px;height:16px"></i>
              <span>25+ All Crops Catalog</span>
            </div>
            <div class="text-[10px] text-slate-400 font-medium">Select any crop to view time & weather advisory</div>
          </div>
          <button onclick="openCropModal()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs flex items-center gap-1 transition-all cursor-pointer shadow-md">
            <i data-lucide="filter" style="width:14px;height:14px"></i>
            <span>Browse All (${CROP_DATABASE.length})</span>
          </button>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
          ${CROP_CATEGORIES.map(cat => `
            <button onclick="state.activeCategory='${cat}'; state.cropSearch=''; document.getElementById('cropSearch').value=''; renderMain();"
              class="px-3 py-1 rounded-xl text-[11px] font-bold shrink-0 transition-all cursor-pointer ${state.activeCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-950 text-slate-400 hover:text-slate-200 border border-slate-800'}">${cat}</button>`).join('')}
        </div>

        <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">
          ${crops.slice(0, 12).map(c => {
            const isSelected = state.selectedCrop === c.id;
            return `
              <button onclick="selectQuickCrop('${c.id}')"
                class="p-2 rounded-xl border text-center transition-all cursor-pointer flex flex-col items-center gap-1 ${isSelected ? 'bg-emerald-900/90 border-emerald-400 text-white shadow-lg ring-1 ring-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800'}">
                <span class="text-xl">${c.icon}</span>
                <span class="text-[10px] font-bold truncate w-full leading-tight">${(state.lang === 'hi' ? c.name_hi : state.lang === 'or' ? c.name_or : c.name).split(' ')[0]}</span>
              </button>`;
          }).join('')}
        </div>

        ${crops.length > 12 ? `<button onclick="openCropModal()" class="w-full py-2 text-center text-xs font-bold text-emerald-400 hover:text-emerald-300 cursor-pointer">+ View ${crops.length - 12} More Crops</button>` : ''}
      </div>

      <!-- AI Soil Health Scanner Feature Card -->
      <button onclick="showScannerNote()" class="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-emerald-950 via-slate-900 to-slate-950 border border-emerald-500/40 hover:border-emerald-400 shadow-lg text-left transition cursor-pointer group">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500/20 text-emerald-400 text-xl border border-emerald-500/30">📸</div>
          <div>
            <div class="text-xs font-black text-white group-hover:text-emerald-300 flex items-center gap-1.5">
              <span>AI Soil Health Scanner</span>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/30 text-emerald-200">NEW</span>
            </div>
            <div class="text-[11px] text-slate-400">Take a photo of field soil for instant AI visual diagnosis & crop match</div>
          </div>
        </div>
        <i data-lucide="chevron-right" class="text-emerald-400 flex-shrink-0 transition-transform group-hover:translate-x-0.5" style="width:20px;height:20px"></i>
      </button>

      <!-- 7-Day Daily Real-Time Forecast Visual Strip -->
      <div class="rounded-2xl bg-slate-900/90 border border-slate-800 p-4 space-y-2">
        <div class="text-xs font-bold text-slate-300 flex items-center justify-between">
          <span>7-Day Real-Time Rainfall Forecast</span>
          <span class="text-[10px] text-sky-400 font-sans font-semibold">📍 ${location.block} (${district})</span>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center font-sans">
          ${strip.map(day => `
            <div class="p-1.5 rounded-lg bg-slate-950 border border-slate-800/80">
              <div class="text-[9px] font-sans text-slate-400 font-medium truncate" title="${day.date}">${day.day}</div>
              <div class="text-sm my-0.5">${day.icon}</div>
              <div class="text-[10px] font-black ${day.rain_mm > 0 ? 'text-sky-300' : 'text-slate-500'}">${day.rain_mm}<span class="text-[9px] font-medium text-slate-400 ml-0.5">mm</span></div>
              <div class="text-[9px] font-black text-orange-300/90">${day.temp_max != null ? Math.round(day.temp_max) : ''}${day.temp_max != null && day.temp_min != null ? '°' : ''}/${day.temp_min != null ? `${Math.round(day.temp_min)}°` : ''}</div>
            </div>`).join('')}
        </div>
      </div>

      <div class="pt-2">
        <p class="text-[10px] text-center text-slate-500 leading-tight">${L.disclaimer}</p>
      </div>

    </div>
  </div>`;

  root.innerHTML = html;
  if (window.lucide) lucide.createIcons();
  if (state.showCropModal) renderCropModal();
}

function selectQuickCrop(id) {
  state.selectedCrop = id;
  localStorage.setItem('saathi_crop', id);
  renderMain();
}

function statusPill() {
  if (state.apiStatus === 'live') {
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-black border bg-emerald-950/60 border-emerald-500/50 text-emerald-300 max-w-[68%]">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
      <span class="truncate">● LIVE — ${escapeHtml(state.apiSource)}</span></span>`;
  }
  if (state.apiStatus === 'offline') {
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-black border bg-amber-950/60 border-amber-500/50 text-amber-300">
      <span class="h-1.5 w-1.5 rounded-full bg-amber-400 shrink-0"></span>
      ⚠ DEMO DATA — backend not reachable</span>`;
  }
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-black border bg-slate-800 border-slate-700 text-slate-300">
    <span class="h-1.5 w-1.5 rounded-full bg-slate-400 animate-pulse shrink-0"></span>
    ● Checking live data…</span>`;
}

async function retryLiveData() {
  state.apiStatus = 'checking';
  state.nowcastData = null;
  state.nowcastError = '';
  renderMain();
  const base = await probeApiBase();
  if (base) {
    API_BASE = base;
    state.apiStatus = 'live';
    state.apiSource = base;
    await loadForecast();
  } else {
    API_BASE = null;
    state.apiStatus = 'offline';
    state.apiSource = '';
  }
  renderMain();
}

function nowcastBody() {
  if (state.checkingWeather) {
    return `<div class="flex items-center justify-center gap-2 py-4 text-slate-400 text-xs font-semibold">
      ${spinnerHtml('text-cyan-400')}<span>Contacting real-time ML radar...</span></div>`;
  }
  if (state.nowcastError) {
    return `<div class="flex items-center gap-2.5 rounded-xl bg-rose-950/60 border border-rose-600/50 p-3">
      ${iconHtml('alert-triangle', 'text-rose-300 flex-shrink-0', 18)}
      <div class="text-[10px] leading-snug text-rose-200 font-semibold">${escapeHtml(state.nowcastError)}</div></div>`;
  }
  if (state.nowcastData) {
    const n = state.nowcastData;
    if (n.severity !== 'NONE') {
      const heavy = n.severity === 'HEAVY_RAIN';
      let html = `
        <div class="flex items-center gap-2.5 rounded-xl p-3 border ${heavy ? 'bg-rose-950/60 border-rose-600/60' : 'bg-sky-950/60 border-sky-600/60'}">
          ${iconHtml('cloud-rain', heavy ? 'text-rose-300' : 'text-sky-300', 24)}
          <div>
            <div class="text-xs font-black ${heavy ? 'text-rose-200' : 'text-sky-200'}">${heavy ? 'Heavy Rain Warning' : 'Rain Expected Soon'}</div>
            <div class="text-[10px] text-slate-400 font-semibold">${n.expected_rainfall_12h_mm} mm rain · ${n.alert_probability || 0}% probability · within 12 hours</div>
          </div>
        </div>
        <p class="text-[11px] leading-relaxed text-slate-300 font-medium">${escapeHtml(n.message_en || '')}</p>`;
      if (state.smsSent && n.sms_delivery) {
        html += `<div class="rounded-lg bg-emerald-950/50 border border-emerald-600/40 px-3 py-2 text-[10px] font-bold text-emerald-300 flex items-center gap-1.5">
          ${iconHtml('check-circle-2')}<span>SMS sent via ${n.sms_delivery.provider} to ${n.sms_delivery.phone}</span></div>`;
      }
      return html;
    }
    return `<div class="flex items-center gap-2.5 rounded-xl bg-slate-950 border border-slate-800 p-3">
      ${iconHtml('sun-medium', 'text-amber-300', 24)}
      <div>
        <div class="text-xs font-black text-amber-200">No Heavy Rain Expected</div>
        <div class="text-[10px] text-slate-400 font-semibold">Clear weather for the next 12 hours in your area</div>
      </div></div>`;
  }
  return `<div class="text-[10px] text-slate-400 font-medium leading-relaxed">
    Real-time AI weather check — detects rain within the next 12 hours and instantly sends a weather alert SMS to your mobile number.</div>`;
}

function adviceBlock(color, icon, title, items, bullet) {
  const palette = {
    emerald: { box: 'bg-emerald-950/40 border-emerald-600/40', title: 'text-emerald-300', icon: 'text-emerald-400', bullet: 'text-emerald-400' },
    rose: { box: 'bg-rose-950/40 border-rose-600/40', title: 'text-rose-300', icon: 'text-rose-400', bullet: 'text-rose-400' },
    cyan: { box: 'bg-cyan-950/40 border-cyan-600/40', title: 'text-cyan-300', icon: 'text-cyan-400', bullet: 'text-cyan-400' },
    amber: { box: 'bg-amber-950/40 border-amber-600/40', title: 'text-amber-300', icon: 'text-amber-400', bullet: 'text-amber-400' }
  }[color];
  return `
    <div class="rounded-xl ${palette.box} p-3 space-y-1.5 shadow-inner">
      <div class="flex items-center gap-1.5 text-xs font-black ${palette.title} uppercase tracking-wider">
        ${iconHtml(icon, palette.icon, 16)}
        <span>${title}</span>
      </div>
      <ul class="space-y-1">
        ${items.map(item => `<li class="text-[11px] text-slate-200 font-medium leading-tight flex items-start gap-1.5">
          <span class="${palette.bullet} font-bold">${bullet}</span><span>${item}</span></li>`).join('')}
      </ul>
    </div>`;
}

function iconHtml(name, cls = '', size = 16) {
  return `<i data-lucide="${name}" class="${cls}" style="width:${size}px;height:${size}px"></i>`;
}
function spinnerHtml(cls = 'text-slate-400') {
  return `<i data-lucide="loader-2" class="${cls} animate-spin" style="width:16px;height:16px"></i>`;
}

function showScannerNote() {
  showToast('📸 AI Soil Health Scanner full module is available in the main MoES app.');
}

/* ============ INIT ============ */
(async function init() {
  const base = await probeApiBase();
  if (base) {
    API_BASE = base;
    state.apiStatus = 'live';
    state.apiSource = base;
    await loadForecast();
  } else {
    state.apiStatus = 'offline';
  }
  renderMain();
})();
</script>
</body>
</html>
